[develop]
script_dir=$base/lib/meridian_clip
[install]
install_scripts=$base/lib/meridian_clip

# [build_scripts] executable 은 일부러 두지 않는다.
#
# 이 노드는 torch / clip / tensorrt 가 있는 파이썬에서만 실행되는데, 그게 어느
# 파이썬인지가 플랫폼마다 다르다 -- Jetson 은 시스템 파이썬(/usr/bin/python3)에
# 다 들어 있고, x86 개발 박스는 conda 환경에만 있다.
#
# 예전에는 여기에 절대경로를 손으로 적게 했다. 그러면 clone 한 사람이 자기
# 플랫폼을 판단해서 고쳐야 하고, 그 값을 커밋하면 남의 빌드가 깨졌다.
# 지금은 setup.py 의 BuildScriptsWithRuntimePython 이 빌드할 때 자동으로 찾는다.
#
# 자동 감지를 무시하고 특정 파이썬을 쓰려면 (커밋되지 않는다):
#   MERIDIAN_CLIP_PYTHON=/path/to/python colcon build --packages-select meridian_clip
