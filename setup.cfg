[develop]
script_dir=$base/lib/meridian_clip
[install]
install_scripts=$base/lib/meridian_clip

# 이 노드는 torch / clip / tensorrt 가 있는 conda 환경에서만 실행된다.
# 지정하지 않으면 colcon 을 띄운 파이썬(/usr/bin/python3)이 shebang 에 박혀
# ros2 launch 시 ModuleNotFoundError: No module named 'clip' 이 난다.
[build_scripts]
executable=~/miniconda3/envs/clip/bin/python
