[develop]
script_dir=$base/lib/meridian_clip
[install]
install_scripts=$base/lib/meridian_clip

# 이 노드는 torch / clip / tensorrt 가 있는 conda 환경에서만 실행된다.
#
# 이 줄이 없으면 colcon 을 띄운 파이썬(/usr/bin/python3)이 shebang 에 박혀
# ros2 launch 가 ModuleNotFoundError 로 죽는다. colcon 은 sys.executable 로
# setup.py 를 돌리는데 /usr/bin/colcon 의 shebang 이 시스템 파이썬이라
# conda 를 활성화해 두고 빌드해도 결과가 같다.
#
# 절대경로를 박으면 clone 한 사람마다 이 파일을 고쳐야 한다. 대신 env 에
# PATH 검색을 맡기고 실행하는 쪽에서 conda 환경을 활성화한다.
#
#     conda activate clip
#     ros2 launch meridian_clip clip_inference.launch.py
#
# 활성화를 잊으면 base 파이썬을 잡아 ModuleNotFoundError 로 죽는다.
# 조용히 잘못된 파이썬으로 도는 경우는 없다.
#
# 상대경로(miniconda3/envs/clip/bin/python 같은)는 쓸 수 없다. shebang 의
# 상대경로는 스크립트 위치가 아니라 **실행하는 프로세스의 cwd** 기준으로
# 풀려서 홈에서 띄울 때만 동작한다. 커널은 ~ 도 확장하지 않는다.
[build_scripts]
executable=/usr/bin/env python3
