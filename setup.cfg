[develop]
script_dir=$base/lib/meridian_clip
[install]
install_scripts=$base/lib/meridian_clip

# 이 노드는 torch / clip / tensorrt 가 있는 파이썬에서만 실행된다.
# 개발 x86 박스에서는 그것이 conda 환경(~/miniconda3/envs/clip/bin/python)이지만,
# Jetson 에서는 torch(2.8.0 aarch64) / tensorrt(10.3) 가 시스템 파이썬에 깔려 있고
# conda 자체가 없다. 여기서는 colcon 을 띄운 파이썬을 그대로 쓴다.
[build_scripts]
executable=/usr/bin/python3
